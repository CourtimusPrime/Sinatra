[project]
name = "sinatra-backend"
version = "0.1.0"
description = "Sinatra — Spotify-powered music discovery and profile sharing API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pymongo>=4.12.0",
    "motor>=3.7.0",
    "spotipy>=2.25.0",
    "openai>=1.86.0",
    "requests>=2.32.0",
    "python-dotenv>=1.1.0",
    "redis>=6.0.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",   # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "db", "models", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
